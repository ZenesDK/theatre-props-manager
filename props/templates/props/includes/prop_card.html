{# Карточка одного предмета: объект prop приходит из цикла списка #}
{# или из контекста страницы предмета. #}
<article class="card prop-card mb-3">
    <div class="card-body d-flex justify-content-between
                align-items-center">
        <div>
            <h2 class="card-title h5 mb-1">
                <a href="{% url 'props:prop_detail' prop.id %}">
                    [{{ prop.inventory_number }}]
                    {{ prop.name|default:"Без названия" }}
                </a>
            </h2>
            <p class="card-text text-muted mb-0">
                {{ prop.category }}
            </p>
        </div>
        {% include "props/includes/prop_status.html" %}
    </div>
</article>
