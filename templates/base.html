{% load static %}
{# Базовый шаблон проекта: общая структура всех страниц. #}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}TheaterProps{% endblock %}</title>
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    >
    <link
        rel="stylesheet"
        href="{% static 'homepage/css/style.css' %}"
    >
</head>
<body>
    <img
        src="{% static 'homepage/img/logo.png' %}"
        alt="TheaterProps"
        class="theaterprops-logo"
    >

    {% include "includes/navigation.html" %}

    <main class="container py-4">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="site-footer border-top py-3 text-center text-muted">
        <p class="mb-0">
            © <span id="current-year"></span>
            TheaterProps — учёт театрального реквизита
        </p>
    </footer>

    <script src="{% static 'homepage/js/main.js' %}"></script>
</body>
</html>
